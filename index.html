<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADAR.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/christmas.css">
    <style>
        body { background: #050505; color: white; font-family: 'Inter', sans-serif; }
        .radar-logo { font-weight: 900; letter-spacing: -0.05em; font-style: italic; }
        .dot { color: #ff007f; }
        .player-card { background: linear-gradient(180deg, #0a0e17 0%, #050505 100%); border: 1px solid #1e1e2e; }
        .btn-purple { background: #7c3aed; }
        @keyframes pulse-pink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .live-dot { animation: pulse-pink 1.5s infinite; }
        .animate-spin-slow { animation: spin 12s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="p-6 flex justify-between items-center border-b border-white/5">
        <div class="radar-logo text-3xl">RADAR<span class="dot">.</span></div>
        <div class="flex items-center space-x-4">
            <button id="xmasToggle" class="christmas-toggle" onclick="ChristmasMode.toggle()">
                <i class="fa-solid fa-tree"></i>
                <span class="xmas-label">Christmas OFF</span>
            </button>
            <div class="flex items-center space-x-2 text-xs font-bold uppercase tracking-widest text-gray-400">
                <span class="w-2 h-2 bg-[#ff007f] rounded-full live-dot"></span>
                <span>Live Global Sync</span>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="player-card w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl">
            <div class="aspect-square bg-slate-900 rounded-3xl mb-8 flex items-center justify-center border border-white/5 relative overflow-hidden">
                <i id="disc" class="fa-solid fa-compact-disc text-8xl text-purple-500/20"></i>
                <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                <span id="jingleBadge" class="jingle-badge absolute top-3 right-3 hidden">
                    <i class="fa-solid fa-bell"></i> Jingle
                </span>
            </div>
            
            <div class="text-center mb-8">
                <h1 id="title" class="text-2xl font-bold mb-1">Station Offline</h1>
                <p id="artist" class="text-purple-400 text-sm font-medium uppercase tracking-tighter">Waiting for Signal</p>
            </div>

            <div class="flex flex-col items-center space-y-6">
                <div class="w-full bg-white/5 h-1 rounded-full overflow-hidden">
                    <div id="progress" class="bg-purple-500 h-full w-0 transition-all duration-300"></div>
                </div>
                <div class="flex items-center justify-center space-x-6">
                    <button onclick="prevTrack()" class="text-gray-400 hover:text-white transition text-lg">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>
                    <button id="playBtn" onclick="togglePlay()" class="w-20 h-20 rounded-full btn-purple flex items-center justify-center shadow-lg shadow-purple-500/20 hover:scale-105 transition active:scale-95">
                        <i id="playIcon" class="fa-solid fa-play text-2xl ml-1"></i>
                    </button>
                    <button onclick="nextTrack()" class="text-gray-400 hover:text-white transition text-lg">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                </div>
                <div class="flex items-center justify-between w-full">
                    <p id="syncStatus" class="text-[10px] text-gray-600 font-mono uppercase">Not Synced</p>
                    <p id="trackIndicator" class="text-[10px] text-gray-600 font-mono uppercase"></p>
                </div>
            </div>
        </div>
    </main>

    <audio id="player" crossorigin="anonymous"></audio>
    <script src="/christmas.js"></script>
    <script>
        let playlist = [];
        let currentIndex = 0;
        let isPlaying = false;
        let isProcessing = false;
        let playingJingle = false;
        const player = document.getElementById('player');
        const API_BASE = '';

        async function syncWithServer() {
            try {
                const res = await fetch(`${API_BASE}/api/tracks`, { cache: 'no-cache' });
                const data = await res.json();
                
                if (data.tracks && data.tracks.length > 0) {
                    playlist = data.tracks;
                    currentIndex = Math.min(currentIndex, playlist.length - 1);
                    loadTrack(currentIndex);
                    
                    document.getElementById('syncStatus').innerText = data.scheduled 
                        ? `Auto-broadcast: ${data.date}` 
                        : 'Synced with Station';
                } else {
                    document.getElementById('title').innerText = 'Station Offline';
                    document.getElementById('artist').innerText = 'Waiting for Signal';
                    document.getElementById('syncStatus').innerText = 'No tracks available';
                }
            } catch (error) {
                console.error('Sync Error:', error);
                document.getElementById('artist').innerText = 'Connection Lost';
            }
        }

        function loadTrack(index) {
            if (!playlist[index]) return;
            const track = playlist[index];
            player.src = track.url;
            player.load();
            document.getElementById('title').innerText = track.name;
            document.getElementById('artist').innerText = 'RADAR. ON AIR';
            document.getElementById('jingleBadge').classList.add('hidden');
            playingJingle = false;
            updateTrackIndicator();
        }

        function updateTrackIndicator() {
            const el = document.getElementById('trackIndicator');
            if (el) el.innerText = playlist.length > 0 ? `${currentIndex + 1} / ${playlist.length}` : '';
        }

        async function togglePlay() {
            if (isProcessing) return;
            isProcessing = true;
            try {
                if (isPlaying) {
                    player.pause();
                    document.getElementById('playIcon').className = 'fa-solid fa-play text-2xl ml-1';
                    document.getElementById('disc').classList.remove('animate-spin-slow');
                    isPlaying = false;
                } else {
                    await player.play();
                    document.getElementById('playIcon').className = 'fa-solid fa-pause text-2xl';
                    document.getElementById('disc').classList.add('animate-spin-slow');
                    isPlaying = true;
                }
            } catch (e) {
                console.error("Playback failed:", e);
                document.getElementById('playIcon').className = 'fa-solid fa-play text-2xl ml-1';
                document.getElementById('disc').classList.remove('animate-spin-slow');
                isPlaying = false;
            } finally {
                isProcessing = false;
            }
        }

        function nextTrack() {
            if (playlist.length === 0) return;
            currentIndex = (currentIndex + 1) % playlist.length;
            loadTrack(currentIndex);
            if (isPlaying) player.play();
        }

        function prevTrack() {
            if (playlist.length === 0) return;
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentIndex);
            if (isPlaying) player.play();
        }

        player.onended = async () => {
            if (ChristmasMode.active && !playingJingle) {
                const jingle = ChristmasMode.getRandomJingle();
                if (jingle) {
                    playingJingle = true;
                    player.src = jingle.url;
                    player.load();
                    document.getElementById('title').innerText = jingle.name;
                    document.getElementById('artist').innerText = 'RADAR. JINGLE';
                    document.getElementById('jingleBadge').classList.remove('hidden');
                    try { await player.play(); } catch (e) { playingJingle = false; nextTrack(); }
                    return;
                }
            }
            playingJingle = false;
            nextTrack();
        };

        player.ontimeupdate = () => {
            if (player.duration) {
                const prog = (player.currentTime / player.duration) * 100;
                document.getElementById('progress').style.width = prog + '%';
            }
        };

        window.addEventListener('load', async () => {
            await ChristmasMode.init();
            await syncWithServer();
            setInterval(syncWithServer, 30000);
            setInterval(() => ChristmasMode.sync(), 15000);
        });
    </script>
</body>
</html>
